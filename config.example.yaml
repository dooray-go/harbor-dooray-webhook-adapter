# harbor-dooray-webhook-adapter config

# Address the HTTP server listens on. Default ":8080".
listen_addr: ":8080"

dooray:
  # Fallback Dooray incoming webhook URL when no repository-specific route matches.
  default_webhook_url: "https://nhncorp.dooray.com/services/XXXX/YYYY/ZZZZ"

  # Optional: displayed bot name / icon in Dooray messages.
  bot_name: "Harbor"
  bot_icon_image: "https://goharbor.io/img/logos/harbor-icon-color.png"

  # Optional: color the notification red when a SCANNING_COMPLETED scan report
  # has this many Critical CVEs or more. Default 1 (any Critical → red).
  # Set to 0 to disable the red override.
  critical_cve_threshold: 1

  # Optional: only forward these Harbor event types. Empty/omitted = forward all.
  # Case-insensitive. Useful to drop noisy SBOM/scan side-effect events.
  allowed_events:
    - PUSH_ARTIFACT
    - DELETE_ARTIFACT
    - SCANNING_COMPLETED
    - SCANNING_FAILED

  # Optional: drop events whose operator contains any of these substrings
  # (case-insensitive). Use it to silence the Trivy scanner (its operator looks
  # like "robot$dooray+...-Trivy-...") while STILL forwarding pushes made by CI
  # robot accounts. Empty/omitted = no operator filtering.
  ignore_operators_containing:
    - "-Trivy-"

  # Optional: drop events whose artifacts are all digest-only (tag empty or
  # "sha256:..."). These are accessory artifacts — SBOM, cosign signatures, scan
  # reports — that Harbor pushes/deletes around scanning (e.g. the
  # DELETE_ARTIFACT done by "admin" when an SBOM is regenerated), not images
  # pushed/deleted by tag. Default false.
  ignore_untagged: true

  # Optional: per-repository routing. Key is the Harbor `repo_full_name`.
  # Falls back to default_webhook_url if not listed.
  repositories:
    library/nginx: "https://nhncorp.dooray.com/services/XXXX/AAAA/BBBB"
    team/api: "https://nhncorp.dooray.com/services/XXXX/CCCC/DDDD"

# Optional: Harbor API access, used only by the expiry watch below. Omit the
# whole section to run as a pure webhook receiver.
harbor:
  url: "https://harbor.example.com"
  # A robot account with read access. IMPORTANT: give it "never expires",
  # otherwise the watcher itself is the next thing to die silently.
  # Listing robot accounts additionally requires a system administrator.
  username: "robot$dooray-expiry-watch"
  password: "xxxxxxxx"

  # Warn before a CVE allowlist or robot account expires. Harbor emits NO
  # webhook for these: an expired allowlist simply stops exempting its CVEs, so
  # pulls that worked yesterday start failing with 412 and nothing is sent.
  expiry_watch:
    # Default true whenever harbor.url is set.
    enabled: true
    # How often to poll. Default "24h".
    interval: "24h"
    # Countdown steps that trigger a notification. Default [30, 14, 7, 3, 1].
    # Anything already expired is re-announced on every poll.
    warn_days: [30, 14, 7, 3, 1]
    # Optional: limit the check to these projects. Empty/omitted = every project
    # the account can see.
    projects: []
    # Optional: also track robot account expiry (401 failures). Default true.
    watch_robots: true
    # Optional: send expiry warnings elsewhere. Empty = default_webhook_url.
    webhook_url: ""
